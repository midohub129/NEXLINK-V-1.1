name: NEXLINK CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web-and-relay:
    name: Typecheck, Lint, Tests, Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Run Unit Tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:unit | tee test-results/unit-tests.tap

      - name: Run Integration Tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:integration | tee test-results/integration-tests.tap

      - name: Production Build
        run: npm run build

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=moderate

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexlink-test-reports-${{ github.sha }}
          path: test-results/
          retention-days: 14

      - name: Upload Production Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexlink-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  verify-android:
    name: Android Debug Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platform 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable & verify version
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Run Android JVM Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Android Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexlink-android-test-reports-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
          retention-days: 14

      - name: Upload Android Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexlink-android-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
